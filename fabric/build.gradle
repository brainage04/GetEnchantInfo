plugins { id 'io.github.brainage04.fabric-mod-conventions' version "${fabricmoddingconventions_version}"; id 'io.github.brainage04.client-gametest-recorder' version "${fabricmoddingconventions_version}"; id 'io.github.brainage04.production-gametests' version "${fabricmoddingconventions_version}"; id 'io.github.brainage04.workspace-dependencies' version "${fabricmoddingconventions_version}"; id 'io.github.brainage04.mod-publishing' version "${fabricmoddingconventions_version}" }
base { archivesName=rootProject.archives_base_name }
sourceSets { main { java.srcDir project.file('src/main/java'); resources.srcDir rootProject.file('src/main/resources') }; gametest { java.srcDir rootProject.file('src/gametest/java'); resources.srcDir rootProject.file('src/gametest/resources') } }
loom { accessWidenerPath=rootProject.file('src/main/resources/getenchantinfo.accesswidener'); mods { main { sourceSet sourceSets.main; sourceSet project(':common').sourceSets.main } }; runs { client { runDir 'run/client' } } }
configurations { common { canBeResolved=true; canBeConsumed=false }; compileClasspath.extendsFrom common; runtimeClasspath.extendsFrom common; developmentFabric.extendsFrom common }
workspaceDependencies { siblingMaven('FabricModdingConventions') { coordinate.set("io.github.brainage04:fabricmoddingconventions:${project.fabricmoddingconventions_version}"); siblingDirectory.set(rootProject.layout.projectDirectory.dir('../FabricModdingConventions')) } }
modPublishing { github.repository.set('brainage04/GetEnchantInfo'); licenseFile.set(rootProject.layout.projectDirectory.file('LICENSE')); modrinth.projectBody.set(rootProject.layout.projectDirectory.file('README.md')); modrinth.iconFile.set(rootProject.layout.projectDirectory.file('src/main/resources/assets/getenchantinfo/icon.png')) }
dependencies { common(project(':common')) { transitive=false }; implementation "io.github.brainage04:fabricmoddingconventions:${project.fabricmoddingconventions_version}" }
tasks.named('jar') { from project(':common').sourceSets.main.output; duplicatesStrategy=DuplicatesStrategy.EXCLUDE }; tasks.named('sourcesJar') { from project(':common').sourceSets.main.allSource; duplicatesStrategy=DuplicatesStrategy.EXCLUDE }
