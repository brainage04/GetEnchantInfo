plugins { id 'dev.architectury.loom-no-remap' version "${architectury_loom_version}" apply false; id 'dev.architectury.loom' version "${architectury_loom_version}" apply false }
allprojects { group=rootProject.maven_group; version=rootProject.mod_version }
subprojects { apply plugin:'java'; base { archivesName="${rootProject.archives_base_name}-${project.name}" }; repositories { maven { url='https://maven.architectury.dev/' }; maven { url='https://maven.neoforged.net/releases/' }; maven { url='https://maven.fabricmc.net/' }; mavenCentral() }; java { toolchain.languageVersion=JavaLanguageVersion.of(rootProject.java_version as int); withSourcesJar() }; tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=rootProject.java_version as int } }
def fabricJar=project(':fabric').tasks.named('jar', org.gradle.api.tasks.bundling.AbstractArchiveTask); def neoForgeJar=project(':neoforge').tasks.named('jar', org.gradle.api.tasks.bundling.AbstractArchiveTask)
tasks.register('collectReleaseArtifacts', Sync) { dependsOn fabricJar,neoForgeJar; from fabricJar.flatMap{it.archiveFile}; from neoForgeJar.flatMap{it.archiveFile}; into layout.buildDirectory.dir('libs') }
tasks.register('build') { dependsOn subprojects.collect { it.tasks.named('build') }; dependsOn tasks.named('collectReleaseArtifacts') }
